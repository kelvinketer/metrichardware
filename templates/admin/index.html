{% extends "admin/index.html" %}

{% block extrahead %}
    {{ block.super }}
    <!-- Load Chart.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        .dashboard-cards { display: flex; gap: 20px; margin-bottom: 30px; margin-top: 10px; }
        .kpi-card { 
            background: #fff; padding: 25px; border-radius: 8px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); flex: 1; 
            border-left: 5px solid #10b981; /* Green by default */
        }
        .kpi-card.warning { border-left-color: #f59e0b; } /* Yellow for outstanding */
        
        .kpi-card h3 { margin: 0 0 10px 0; color: #6b7280; font-size: 13px; text-transform: uppercase; font-weight: bold; letter-spacing: 0.05em; }
        .kpi-card p { margin: 0; font-size: 28px; font-weight: 900; color: #111827; }
        
        .chart-container { 
            background: #fff; padding: 20px; border-radius: 8px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
            margin-bottom: 40px; 
        }
    </style>
{% endblock %}

{% block content %}
    <div id="content-main" style="width: 100%;">
        
        <h1 style="margin-bottom: 15px; color: #111827;">Financial Command Center</h1>
        
        <!-- KPI Metric Cards -->
        <div class="dashboard-cards">
            <div class="kpi-card">
                <h3>Total Revenue (Paid & Shipped)</h3>
                <p id="kpi-revenue">KES 0.00</p>
            </div>
            <div class="kpi-card warning">
                <h3>Outstanding (Awaiting M-Pesa)</h3>
                <p id="kpi-outstanding">KES 0.00</p>
            </div>
        </div>

        <!-- Pipeline Bar Chart -->
        <div class="chart-container">
            <canvas id="pipelineChart" height="80"></canvas>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', function() {
                // Fetch the live data from our new API
                fetch('/api/admin-analytics/')
                    .then(response => response.json())
                    .then(data => {
                        
                        // 1. Update the Text KPIs
                        document.getElementById('kpi-revenue').textContent = 'KES ' + data.revenue.toLocaleString();
                        document.getElementById('kpi-outstanding').textContent = 'KES ' + data.outstanding.toLocaleString();

                        // 2. Prepare Data for the Chart
                        const labels = data.pipeline.map(item => item.status.toUpperCase());
                        const counts = data.pipeline.map(item => item.count);

                        // 3. Render the Chart.js Graphic
                        const ctx = document.getElementById('pipelineChart').getContext('2d');
                        new Chart(ctx, {
                            type: 'bar',
                            data: {
                                labels: labels,
                                datasets: [{
                                    label: 'Active Orders',
                                    data: counts,
                                    backgroundColor: [
                                        '#eab308', // Pending (Yellow)
                                        '#3b82f6', // Reviewed (Blue)
                                        '#6366f1', // Accepted (Indigo)
                                        '#10b981', // Paid (Green)
                                        '#f97316', // Loading (Orange)
                                        '#06b6d4', // Dispatched (Cyan)
                                        '#14b8a6'  // Delivered (Teal)
                                    ],
                                    borderRadius: 6
                                }]
                            },
                            options: {
                                responsive: true,
                                plugins: {
                                    legend: { display: false },
                                    title: { display: true, text: 'Order Logistics Pipeline', font: {size: 16} }
                                },
                                scales: {
                                    y: { beginAtZero: true, ticks: { stepSize: 1 } }
                                }
                            }
                        });
                    })
                    .catch(error => console.error("Error loading analytics:", error));
            });
        </script>

        <!-- Divider before standard Django Admin stuff -->
        <h2 style="margin-top: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px;">Database Management</h2>
        
        <!-- Render the standard Django Admin apps underneath -->
        {{ block.super }}
    </div>
{% endblock %}
